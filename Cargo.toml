[package]
name = "keydock"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fernandwill/keydock"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
# Exact pin: tests/tray_quit.py relies on this release's private window class and callback message.
tray-icon = { version = "=0.26.1", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
